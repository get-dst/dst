<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 190" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace">
  <style>
    .chip { fill: #ffffff; stroke: #dddbd6; }
    .chipa { fill: #f1efe9; stroke: #dddbd6; }
    .label { font-size: 13px; fill: #1a1917; }
    .small { font-size: 10px; fill: #6f6a64; letter-spacing: 0.05em; }
    .arrow { stroke: #1a1917; stroke-width: 1.5; fill: none; marker-end: url(#lh); }
  </style>
  <defs>
    <marker id="lh" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#1a1917"/>
    </marker>
  </defs>

  <g>
    <rect class="chip" x="14" y="50" width="120" height="40" rx="6"/>
    <text class="label" x="74" y="75" text-anchor="middle">serve</text>
    <rect class="chip" x="166" y="50" width="120" height="40" rx="6"/>
    <text class="label" x="226" y="75" text-anchor="middle">observe</text>
    <rect class="chip" x="318" y="50" width="120" height="40" rx="6"/>
    <text class="label" x="378" y="75" text-anchor="middle">correct</text>
    <rect class="chipa" x="470" y="50" width="120" height="40" rx="6"/>
    <text class="label" x="530" y="75" text-anchor="middle">certify</text>
    <rect class="chipa" x="622" y="50" width="120" height="40" rx="6"/>
    <text class="label" x="682" y="75" text-anchor="middle">gate</text>
  </g>

  <path class="arrow" d="M134,70 L162,70"/>
  <path class="arrow" d="M286,70 L314,70"/>
  <path class="arrow" d="M438,70 L466,70"/>
  <path class="arrow" d="M590,70 L618,70"/>
  <path class="arrow" d="M682,94 C682,140 74,140 74,98"/>

  <text class="small" x="74" y="38" text-anchor="middle">RECEIPTS OUT</text>
  <text class="small" x="226" y="38" text-anchor="middle">HONEST KPIS</text>
  <text class="small" x="378" y="38" text-anchor="middle">WRONG? REPORTED</text>
  <text class="small" x="530" y="38" text-anchor="middle">FIX → CERTIFIED</text>
  <text class="small" x="682" y="38" text-anchor="middle">GATES IN CI</text>
  <text class="small" x="378" y="165" text-anchor="middle">A MISTAKE FIXED ONCE STAYS FIXED. THE NUMBERS MOVE, AND YOU CAN POINT AT WHY.</text>
</svg>
