<text x="20" y="228" xml:space="preserve"><tspan fill="#d9d2c5">not checked by plan — apply still runs these, and they need a live warehouse</tspan></text>
<text x="20" y="249" xml:space="preserve"><tspan fill="#d9d2c5">  - warehouse connection probes — apply builds every declared connection and reads through it before</tspan></text>
<text x="20" y="270" xml:space="preserve"><tspan fill="#d9d2c5"> it lands, and a dead credential aborts the apply</tspan></text>
<text x="20" y="291" xml:space="preserve"><tspan fill="#d9d2c5">  - eval-case expected_sql EXECUTED against the warehouse (plan parses it only) — an oracle that par</tspan></text>
<text x="20" y="312" xml:space="preserve"><tspan fill="#d9d2c5">ses but errors aborts the apply</tspan></text>
<text x="20" y="333" xml:space="preserve"><tspan fill="#d9d2c5">  - the publish eval gate — it scores the certified corpus with live generation, so under `eval_gate</tspan></text>
<text x="20" y="354" xml:space="preserve"><tspan fill="#d9d2c5">: block` a regression can still abort the apply</tspan></text>
<text x="20" y="375" xml:space="preserve"><tspan fill="#efe9dd" font-weight="700">Plan: 6 to add.</tspan><tspan fill="#d9d2c5"> </tspan><tspan fill="#857b6f">(--full shows diffs and hints)</tspan></text>
