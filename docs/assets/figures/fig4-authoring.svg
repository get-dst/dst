<text x="714" y="68" font-size="12.5" fill="#b45309" text-anchor="start" font-weight="700" xml:space="preserve">dst apply — one transaction</text>
<line x1="714" y1="80" x2="926" y2="80" stroke="#d8cfbf" stroke-width="1.1"/>
<text x="714" y="102" font-size="10.5" fill="#292524" text-anchor="start" xml:space="preserve">✓ static checks — every file</text>
<text x="714" y="122" font-size="10.5" fill="#292524" text-anchor="start" xml:space="preserve">✓ probe every connection</text>
<text x="714" y="142" font-size="10.5" fill="#292524" text-anchor="start" xml:space="preserve">✓ eval suite — every certified</text>
<text x="728" y="158" font-size="10.5" fill="#292524" text-anchor="start" xml:space="preserve">answer re-runs, executed</text>
