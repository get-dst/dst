<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 452" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <rect x="0.5" y="0.5" width="759" height="451" rx="8" fill="#161310" stroke="#38322b"/>
  <rect x="0.5" y="0.5" width="759" height="27.5" rx="8" fill="#1d1916"/>
  <rect x="0.5" y="14" width="759" height="14" fill="#1d1916"/>
  <path d="M 0.5 28 L 759.5 28" stroke="#38322b" stroke-width="1"/>
  <text x="380" y="18.5" font-size="11" fill="#857b6f" text-anchor="middle" xml:space="preserve">the AI your team uses — any of them</text>

  <rect x="468" y="42" width="262" height="30" rx="8" fill="#27221c" stroke="#38322b"/>
  <text x="599" y="61.5" font-size="12.5" fill="#efe9dd" text-anchor="middle" xml:space="preserve">Where should we look for growth?</text>

  <rect x="30" y="86" width="2.5" height="14" fill="#3fa37c"/>
  <text x="42" y="97" font-size="11" fill="#857b6f" xml:space="preserve">asked dst — how many customers are repeat customers?</text>
  <rect x="30" y="106" width="2.5" height="14" fill="#3fa37c"/>
  <text x="42" y="117" font-size="11" fill="#857b6f" xml:space="preserve">asked dst — what was total revenue?</text>
  <rect x="30" y="126" width="2.5" height="14" fill="#3fa37c"/>
  <text x="42" y="137" font-size="11" fill="#857b6f" xml:space="preserve">asked dst — revenue by month…  (and more)</text>

  <text x="30" y="166" font-size="12.5" fill="#d9d2c5" xml:space="preserve">Your clearest lever is repeat purchases. Of your 100 customers, <tspan fill="#3fa37c">only 19 have</tspan></text>
  <text x="30" y="185" font-size="12.5" fill="#d9d2c5" xml:space="preserve"><tspan fill="#3fa37c">bought more than once</tspan> — 81 bought exactly once and never came back. Total</text>
  <text x="30" y="204" font-size="12.5" fill="#d9d2c5" xml:space="preserve">revenue stands at <tspan fill="#3fa37c">$1,761</tspan>, so converting even a fraction of those one-time</text>
  <text x="30" y="223" font-size="12.5" fill="#d9d2c5" xml:space="preserve">buyers into second orders is the fastest growth path in this data.</text>

  <rect x="380" y="246" width="350" height="30" rx="8" fill="#27221c" stroke="#38322b"/>
  <text x="555" y="265" font-size="12.5" fill="#efe9dd" text-anchor="middle" xml:space="preserve">And what is the average value of a customer?</text>

  <rect x="30" y="290" width="2.5" height="14" fill="#3fa37c"/>
  <text x="42" y="301" font-size="11" fill="#857b6f" xml:space="preserve">asked dst — clarify came back</text>

  <text x="30" y="330" font-size="12.5" fill="#d9d2c5" xml:space="preserve">Before I answer — 'value' means two different things in your data. Which do</text>
  <text x="30" y="349" font-size="12.5" fill="#d9d2c5" xml:space="preserve">you want?</text>
  <text x="30" y="372" font-size="12.5" fill="#3fa37c" xml:space="preserve">  · lifetime value — total historical revenue per customer</text>
  <text x="30" y="391" font-size="12.5" fill="#3fa37c" xml:space="preserve">  · order amount — a single order's total</text>

  <line x1="30" y1="412" x2="730" y2="412" stroke="#38322b" stroke-dasharray="3 3"/>
  <text x="380" y="434" font-size="10.5" fill="#857b6f" text-anchor="middle" xml:space="preserve">green — from dst, logged with SQL, confidence, and cost · the rest is the AI's own analysis</text>
</svg>