<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 340" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13"><defs><marker id="ai" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7.5" markerHeight="6.5" orient="auto-start-reverse"><polygon points="0,0 10,4 0,8" fill="#292524"/></marker><marker id="aa" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7.5" markerHeight="6.5" orient="auto-start-reverse"><polygon points="0,0 10,4 0,8" fill="#b45309"/></marker></defs><rect width="1120" height="340" fill="#faf6ee"/>
<text x="275" y="104" font-size="10" fill="#8a8178" text-anchor="middle" xml:space="preserve">send for review —</text>
<text x="275" y="118" font-size="10" fill="#8a8178" text-anchor="middle" xml:space="preserve">the agent, or auto_review</text>
<text x="545" y="104" font-size="10" fill="#8a8178" text-anchor="middle" xml:space="preserve">the AI judge triages —</text>
<text x="545" y="118" font-size="10" fill="#8a8178" text-anchor="middle" xml:space="preserve">only confident approves resolve</text>
<text x="840" y="104" font-size="10" fill="#8a8178" text-anchor="middle" xml:space="preserve">the ruling lands as</text>
<rect x="40" y="140" width="210" height="90" fill="#fffdf7" stroke="#292524" stroke-width="1.1"/>
<text x="145" y="172" font-size="12.5" fill="#292524" text-anchor="middle" font-weight="700" xml:space="preserve">a served answer</text>
<text x="145" y="194" font-size="10.5" fill="#8a8178" text-anchor="middle" xml:space="preserve">“48 400 € commission”</text>
<text x="145" y="210" font-size="10.5" fill="#8a8178" text-anchor="middle" xml:space="preserve">…did we include clawbacks?</text>
<line x1="250" y1="185" x2="296" y2="185" stroke="#292524" stroke-width="1.1" marker-end="url(#ai)"/>
<rect x="300" y="130" width="200" height="110" fill="#fffdf7" stroke="#292524" stroke-width="1.1"/>
<text x="400" y="160" font-size="12.5" fill="#292524" text-anchor="middle" font-weight="700" xml:space="preserve">the ticket</text>
<text x="400" y="182" font-size="10.5" fill="#8a8178" text-anchor="middle" xml:space="preserve">the full trace:</text>
<text x="400" y="198" font-size="10.5" fill="#8a8178" text-anchor="middle" xml:space="preserve">question · SQL · rows</text>
<text x="400" y="214" font-size="10.5" fill="#8a8178" text-anchor="middle" xml:space="preserve">answer · verification</text>
<line x1="500" y1="185" x2="586" y2="185" stroke="#292524" stroke-width="1.1" marker-end="url(#ai)"/>
<rect x="590" y="130" width="210" height="110" fill="#f6e8d7" stroke="#b45309" stroke-width="1.6"/>
<text x="695" y="162" font-size="13" fill="#b45309" text-anchor="middle" font-weight="700" xml:space="preserve">a human rules</text>
<text x="695" y="186" font-size="10.5" fill="#292524" text-anchor="middle" xml:space="preserve">approve · changes · reject</text>
<text x="695" y="204" font-size="10.5" fill="#8a8178" text-anchor="middle" xml:space="preserve">never auto-merged</text>
<line x1="800" y1="185" x2="876" y2="185" stroke="#292524" stroke-width="1.1" marker-end="url(#ai)"/>
<rect x="880" y="130" width="200" height="110" fill="#fffdf7" stroke="#292524" stroke-width="1.1"/>
<text x="980" y="160" font-size="12.5" fill="#292524" text-anchor="middle" font-weight="700" xml:space="preserve">files in your repo</text>
<text x="980" y="182" font-size="10.5" fill="#8a8178" text-anchor="middle" xml:space="preserve">the patch — definition</text>
<text x="980" y="198" font-size="10.5" fill="#8a8178" text-anchor="middle" xml:space="preserve">or certified SQL,</text>
<text x="980" y="214" font-size="10.5" fill="#8a8178" text-anchor="middle" xml:space="preserve">+ a regression eval case</text>
<text x="560" y="292" font-size="11" fill="#b45309" text-anchor="middle" font-weight="700" xml:space="preserve">a person doubted a number — the system turns that into a permanent guarantee</text>
</svg>