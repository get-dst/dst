<text x="480" y="96" font-size="17" fill="#292524" text-anchor="middle" font-weight="700" xml:space="preserve">deploy</text>
<text x="480" y="120" font-size="10.5" fill="#8a8178" text-anchor="middle" xml:space="preserve">through gates that fail loudly,</text>
<text x="480" y="136" font-size="10.5" fill="#8a8178" text-anchor="middle" xml:space="preserve">atomic and versioned</text>
<rect x="650" y="60" width="250" height="96" fill="#fffdf7" stroke="#292524" stroke-width="1.1"/>
<text x="775" y="96" font-size="17" fill="#292524" text-anchor="middle" font-weight="700" xml:space="preserve">audit</text>
<text x="775" y="120" font-size="10.5" fill="#8a8178" text-anchor="middle" xml:space="preserve">every call priced, signed,</text>
<text x="775" y="136" font-size="10.5" fill="#8a8178" text-anchor="middle" xml:space="preserve">and on the ledger</text>
