<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13"><defs><marker id="ai" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7.5" markerHeight="6.5" orient="auto-start-reverse"><polygon points="0,0 10,4 0,8" fill="#292524"/></marker><marker id="aa" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7.5" markerHeight="6.5" orient="auto-start-reverse"><polygon points="0,0 10,4 0,8" fill="#206b4e"/></marker></defs><rect width="960" height="300" fill="#faf6ee"/>
<rect x="60" y="60" width="250" height="96" fill="#e4ecdf" stroke="#206b4e" stroke-width="1.6"/>
<text x="185" y="96" font-size="17" fill="#206b4e" text-anchor="middle" font-weight="700" xml:space="preserve">test</text>
<text x="185" y="120" font-size="10.5" fill="#8a8178" text-anchor="middle" xml:space="preserve">every approved answer is a</text>
<text x="185" y="136" font-size="10.5" fill="#8a8178" text-anchor="middle" xml:space="preserve">regression test on your data</text>
