services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: dst
      POSTGRES_PASSWORD: dst_dev
      POSTGRES_DB: dst
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dst"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
