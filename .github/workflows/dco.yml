# CONTRIBUTING asks every commit to carry a Developer Certificate of Origin
# sign-off. An unenforced promise is not a guarantee — this makes it fail loud,
# on the PR, before review time is spent on it.
name: DCO

on:
  pull_request:

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit signed off by its author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          for sha in $(git rev-list "$BASE..$HEAD"); do
            author="$(git show -s --format='%an <%ae>' "$sha")"
            if git show -s --format='%B' "$sha" | grep -qiF "Signed-off-by: $author"; then
              echo "ok   $(git show -s --format='%h %s' "$sha")"
            else
              echo "::error::$(git show -s --format='%h %s' "$sha") — missing 'Signed-off-by: $author'"
              fail=1
            fi
          done
          if [ "$fail" = 1 ]; then
            echo
            echo "Fix with: git rebase --signoff $BASE  (then force-push your branch)"
            exit 1
          fi
