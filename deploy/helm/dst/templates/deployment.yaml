apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dst.fullname" . }}
  labels: {{- include "dst.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "dst.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "dst.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: dst
          image: {{ include "dst.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext: {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: 8000
              name: http
          env:
            {{- include "dst.contractEnv" . | nindent 12 }}
            # Migrations belong to the hook Job, not serving pods.
            - name: DST_MIGRATE_ON_START
              value: "false"
          {{- with .Values.envFrom }}
          envFrom: {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 15
          readinessProbe:
            # /ready exercises the DB and the in-process MCP transport — real,
            # but not free; keep the period generous.
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 5
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # Python scratch space (upload spooling, tempfiles) — the root
            # filesystem is read-only by default.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
