views:
- name: sales_lens
  title: Sales
  description: Orders, revenue and stock across the bakeries.
  meta:
    dst:
      sources:
      - till
      - web shop
  cubes:
  - join_path: orders
    includes:
    - order_id
    - store_id
    - channel
    - status
    - ordered_at
    - shipped_on
    - amount_eur
    - discount_eur
    - tips_eur_value
    - revenue
    - order_count
    - discount_total
    - tips_eur
    - shipped_revenue
    - average_order_value
    - net_revenue
    - web_order
    prefix: true
  - join_path: order_lines
    includes:
    - order_id
    - line_number
    - product
    - qty
    - line_total_eur
    - order_discount_eur
    - units_sold
    - product_revenue
    prefix: true
  - join_path: order_lines_by_order_id
    includes:
    - order_id
    - line_number
    - product
    - qty
    - line_total_eur
    - order_discount_eur
    - order_discount
    prefix: true
  - join_path: stores
    includes:
    - store_id
    - store_name
    - region
    - opened_on
    - manager_email
    - store_count
    prefix: true
  - join_path: stock_monthly
    includes:
    - month
    - store_id
    - units_on_hand
    - stock_on_hand
    prefix: true
  access_policy:
  - group: '*'
    member_level:
      excludes:
      - stores_manager_email
  - group: ops
    member_level:
      includes: '*'
