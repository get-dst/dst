# dst overlay over the Cube model: everything dst-only that is not a member meta key.
# Generated by `dst migrate-model`; lenses = scope + policy over views.
version: 1
cubes:
  orders:
    default_time_dimension: ordered_at
    use_cases:
    - Use when a question asks about orders, revenue, discounts or basket size.
    common_questions:
    - revenue by store last month
    caveats:
    - rows repeat once per sync; the latest sync per order is the order
  stock_monthly:
    default_time_dimension: month
lenses:
  sales:
    owner: ops
    timezone: Europe/Helsinki
    stale_after_days: 3
    scope: own
    sources:
    - till
    - web shop
    not_for:
    - ask: wholesale revenue
      sibling: wholesale
    not_computable:
    - measure: customer lifetime value
      aliases:
      - CLV
      reason: no customer identity is held
    access:
      allow:
      - group: everyone
    eval_gate: warn
    definitions:
    - web_order
    - region
    - basket
    - margin
    views:
    - sales_lens
    - sales_order_lines
    - sales_orders
    - sales_stock_monthly
    - sales_order_lines_by_order_id
definitions:
- metric: basket
  about: orders
  summary: The products on one order.
  aliases:
  - basket
  - cart
  file: semantic/definitions/shop/basket.md
- metric: region
  about: stores.region
  summary: 'A store''s region: Coast, North or South.'
  aliases:
  - region
  - area
  file: semantic/definitions/shop/region.md
ambiguous:
- metric: margin
  summary: Ambiguous - revenue less discounts, or product revenue less cost; say which.
  aliases:
  - margin
  status: ambiguous
  possible_mappings:
  - revenue less discounts - orders.net_revenue
  - product revenue less cost - not held
  audiences:
    finance: revenue less discounts
  file: semantic/definitions/shop/margin.md
hide:
- cube: stores
  dimension: manager_email
  except_groups:
  - ops
