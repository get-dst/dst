name: stores
description: The bakeries.
grain: one row per store
source: {connection: warehouse, table: bakery.stores}
primary_key: [store_id]
fields:
  - {name: store_id, type: integer}
  - {name: store_name, type: string}
  - {name: region, type: string}
  - {name: opened_on, type: date}
  - {name: manager_email, type: string}
  - {name: legacy_code, type: string}
dimensions:
  - {name: region, aliases: [area]}
  - {name: store_name, aliases: [store, bakery]}
internal: [legacy_code]
hide:
  - {column: manager_email, except_groups: [ops]}
metrics:
  - name: store_count
    agg: count
    label: stores
