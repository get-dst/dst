- question: share of group revenue from Sweden in {period}
  sql: >
    SELECT SUM(CASE WHEN entity = 'Bergström Rör AB' THEN revenue_eur ELSE 0 END) / SUM(revenue_eur) AS sweden_share
    FROM intermediate.int_revenue_by_entity_month
    WHERE revenue_stream <> 'Intercompany'
      AND month >= strftime(CAST({period.start} AS DATE), '%Y-%m') AND month < strftime(CAST({period.end} AS DATE), '%Y-%m')
  slots: {period: {type: date_range}}
  sample_bindings: [{period: 2025-11-01/2026-08-31}, {period: 2026}]
  source: "finance: Sweden share of group revenue since the acquisition (1 November 2025)"
  verified_by: data engineering lead (reference catalogue, verified by running the SQL against the warehouse)
- question: Bergström Rör revenue in SEK by month in {period}
  sql: >
    SELECT strftime(fakturadatum, '%Y-%m') AS month, SUM(belopp_exkl_moms) AS se_revenue_sek
    FROM raw_fortnox_bergstrom.fakturor
    WHERE fakturadatum >= CAST({period.start} AS DATE) AND fakturadatum < CAST({period.end} AS DATE)
    GROUP BY 1 ORDER BY 1
  slots: {period: {type: date_range}}
  sample_bindings: [{period: 2026-07-01/2026-08-31}, {period: 2026}]
  source: "finance: Bergström SEK revenue from the Fortnox export, ex-VAT by invoice date"
  verified_by: data engineering lead (reference catalogue, verified by running the SQL against the warehouse)
- question: what did the month-end pack report for {period} by entity and stream
  sql: >
    SELECT month, entity, revenue_stream, revenue_eur AS pack_revenue_eur FROM marts_revenue.mart_revenue_month_end
    WHERE month >= strftime(CAST({period.start} AS DATE), '%Y-%m') AND month < strftime(CAST({period.end} AS DATE), '%Y-%m')
    ORDER BY 1, 2, 3
  slots: {period: {type: date_range}}
  sample_bindings: [{period: 2026-05}, {period: 2026-Q2}]
  source: "finance: month-end pack"
  verified_by: data engineering lead (reference catalogue, verified by running the SQL against the warehouse)
- question: how much revenue was restated after the pack closed, by month, in {period}
  sql: >
    SELECT month, SUM(restated_eur) AS restated_eur FROM marts_revenue.mart_revenue_movements
    WHERE month >= strftime(CAST({period.start} AS DATE), '%Y-%m') AND month < strftime(CAST({period.end} AS DATE), '%Y-%m')
    GROUP BY 1 ORDER BY 1
  slots: {period: {type: date_range}}
  sample_bindings: [{period: 2026}, {period: 2026-05}]
  source: "finance: restatements = current books minus pack"
  verified_by: data engineering lead (reference catalogue, verified by running the SQL against the warehouse)
- question: how are we tracking against budget in {period}
  sql: >
    SELECT SUM(actual_eur) AS actual_eur, SUM(budget_eur) AS budget_eur, SUM(actual_eur) - SUM(budget_eur) AS variance_eur,
           SUM(actual_eur) / SUM(budget_eur) AS attainment_vs_budget
    FROM marts_finance.mart_budget_vs_actual_monthly
    WHERE month <= '2026-08'
      AND month >= strftime(CAST({period.start} AS DATE), '%Y-%m') AND month < strftime(CAST({period.end} AS DATE), '%Y-%m')
  slots: {period: {type: date_range}}
  sample_bindings: [{period: 2026-Q3}, {period: 2026-Q2}, {period: 2026}]
  source: "finance: budget vs actual, loaded months only (actuals end August 2026)"
  verified_by: data engineering lead (reference catalogue, verified by running the SQL against the warehouse)
- question: budget variance by entity in {period}
  sql: >
