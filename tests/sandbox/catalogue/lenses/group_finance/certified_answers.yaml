- question: overdue receivables at the end of {month}
  sql: >
    SELECT month, outstanding_eur AS overdue_receivables_eur, invoices AS overdue_invoices FROM marts_finance.mart_ar_aging_monthly
    WHERE bucket = 'overdue' AND month = strftime(CAST({month.start} AS DATE), '%Y-%m')
  slots: {month: {type: date_range}}
  sample_bindings: [{month: 2026-05}, {month: 2026-03}]
  source: "finance: AR aging month-end snapshot (last snapshot May 2026)"
  verified_by: data engineering lead (reference catalogue, verified by running the SQL against the warehouse)
- question: which invoices are more than {days} days overdue
  sql: >
    SELECT invoice_id, customer_id, revenue_stream, due_date, outstanding_eur FROM marts.fct_invoices
    WHERE outstanding_eur > 0 AND due_date < CURRENT_DATE - CAST({days} AS INTEGER) * INTERVAL 1 DAY
    ORDER BY outstanding_eur DESC, invoice_id
  slots: {days: {type: number}}
  sample_bindings: [{days: 60}, {days: 30}]
  source: "finance: overdue invoices = unpaid balance past due date, as of today"
  verified_by: data engineering lead (reference catalogue, verified by running the SQL against the warehouse)
- question: which customers owe us the most money
  sql: >
    SELECT c.customer_name, SUM(i.outstanding_eur) AS outstanding_eur FROM marts.fct_invoices i
    JOIN marts_customer.dim_customer_360 c ON c.customer_id = i.customer_id
    WHERE i.outstanding_eur > 0 GROUP BY 1 ORDER BY 2 DESC, 1 LIMIT 10
  source: "finance: outstanding balance per customer, today"
  verified_by: data engineering lead (reference catalogue, verified by running the SQL against the warehouse)
- question: top 10 customers by invoiced revenue in {period}
  sql: >
    SELECT c.customer_name, SUM(r.invoiced_eur) AS invoiced_eur FROM marts_revenue.mart_revenue_by_customer_monthly r
    JOIN marts_customer.dim_customer_360 c ON c.customer_id = r.customer_id
    WHERE r.month >= strftime(CAST({period.start} AS DATE), '%Y-%m') AND r.month < strftime(CAST({period.end} AS DATE), '%Y-%m')
    GROUP BY 1 ORDER BY 2 DESC, 1 LIMIT 10
  slots: {period: {type: date_range}}
  sample_bindings: [{period: 2026}, {period: 2025}]
  source: "finance: revenue per CRM customer (invoiced ex-VAT)"
  verified_by: data engineering lead (reference catalogue, verified by running the SQL against the warehouse)
