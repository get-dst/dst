# Certified answers: question -> SQL pairs a named person vouched for, served verbatim.
# Templates carry {slot} placeholders; the first sample binding is the test case.
- question: group revenue in {period}
  sql: >
    SELECT SUM(revenue_eur) AS revenue_eur FROM intermediate.int_revenue_by_entity_month
    WHERE revenue_stream <> 'Intercompany'
      AND month >= strftime(CAST({period.start} AS DATE), '%Y-%m') AND month < strftime(CAST({period.end} AS DATE), '%Y-%m')
  slots: {period: {type: date_range}}
  sample_bindings: [{period: 2026-Q2}, {period: 2026-05}, {period: 2026}]
  source: "finance: group revenue definition (ex-VAT, average FX, intercompany and migration out)"
  verified_by: data engineering lead (reference catalogue, verified by running the SQL against the warehouse)
- question: group revenue by month in {period}
  sql: >
    SELECT month, SUM(revenue_eur) AS revenue_eur FROM intermediate.int_revenue_by_entity_month
    WHERE revenue_stream <> 'Intercompany'
      AND month >= strftime(CAST({period.start} AS DATE), '%Y-%m') AND month < strftime(CAST({period.end} AS DATE), '%Y-%m')
    GROUP BY 1 ORDER BY 1
  slots: {period: {type: date_range}}
  sample_bindings: [{period: 2026}, {period: 2026-Q1}]
  source: "finance: group revenue definition"
  verified_by: data engineering lead (reference catalogue, verified by running the SQL against the warehouse)
- question: revenue by entity in {period}, ex-VAT
